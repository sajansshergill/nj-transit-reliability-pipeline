name: ci

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (lightweight, offline test deps)
        run: pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests + data-quality gates
        run: pytest -q

  dbt-duckdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt (DuckDB adapter)
        run: pip install dbt-core==1.8.7 dbt-duckdb==1.8.4
      - name: Build models + run dbt tests on seeded sample
        env:
          DBT_PROFILES_DIR: dbt
        run: |
          cp dbt/profiles.example.yml dbt/profiles.yml
          cd dbt
          dbt seed --target duckdb
          dbt build --target duckdb